name: Rotate signature quote

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs slightly under load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install Pillow

      - name: Render a random quote
        run: python3 render.py

            - name: Commit and push if changed
        run: |
          git config user.name "quote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quote.png
          if ! git diff --cached --quiet; then
            git commit -m "Rotate quote"
            git push
          else
            echo "No change"
          fi
